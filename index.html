<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login & Signup</title>
    <link rel="stylesheet" href="../styles/login_signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            background: url('https://png.pngtree.com/background/20210716/original/pngtree-digital-office-background-picture-image_1337979.jpg') no-repeat center center fixed;
            background-size: cover;
            animation: backgroundAnimation 10s infinite ease-in-out;
        }

        @keyframes backgroundAnimation {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        .container {
            position: relative;
            width: 400px;
            height: 500px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-box {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login {
            transform: translateX(0);
        }

        .signup {
            transform: translateX(100%);
        }

        .form-container.show-signup .login {
            transform: translateX(-100%);
        }

        .form-container.show-signup .signup {
            transform: translateX(0);
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            background: white;
            transition: 0.3s ease-in-out;
        }

        label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #999;
            pointer-events: none;
            transition: 0.3s ease-in-out;
            background: white;
            padding: 0 5px;
        }

        input:focus ~ label,
        input:valid ~ label {
            top: 0;
            font-size: 12px;
            color: #2196f3;
        }

        input:focus,
        input:valid {
            border-color: #2196f3;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #1976d2;
        }

        p {
            color: #666;
            margin-top: 20px;
        }

        a {
            color: #2196f3;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
         <!-- Login Form -->
            <div class="form-box login">
                <h2><i class="fas fa-user-circle"></i> Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="email" id="loginEmail" required>
                        <label>Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="loginPassword" required>
                        <label>Password</label>
                    </div>
                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account? <a href="#" class="toggle-form">Sign Up</a></p>
            </div>

            <!-- Signup Form -->
            <div class="form-box signup">
                <h2><i class="fas fa-user-plus"></i> Sign Up</h2>
                <form id="signupForm">
                    <div class="input-group">
                        <input type="text" id="signupUsername" required>
                        <label>Username</label>
                    </div>
                    <div class="input-group">
                        <input type="email" id="signupEmail" required>
                        <label>Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="signupPassword" required>
                        <label>Password</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="signupConfirmPassword" required>
                        <label>Confirm Password</label>
                    </div>
                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account? <a href="#" class="toggle-form">Login</a></p>
            </div>
        </div>
    </div>

<script type="module">
    // Import Firebase SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
    apiKey: "AIzaSyCdLjLDG4PvNXN5OLQD5mQkiFjfvcO4ies",
    authDomain: "future-fashion-store-95ecf.firebaseapp.com",
    databaseURL: "https://future-fashion-store-95ecf-default-rtdb.firebaseio.com",
    projectId: "future-fashion-store-95ecf",
    storageBucket: "future-fashion-store-95ecf.firebasestorage.app",
    messagingSenderId: "681656664403",
    appId: "1:681656664403:web:fba81bbaef61a422f861a6",
    measurementId: "G-PB7ETHGRBE"
  };
  

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const confirmPassword = document.getElementById('signupConfirmPassword').value;

        if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return;
        }

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            alert('Signup successful! You can now log in.');
            document.querySelector('.form-container').classList.toggle('show-signup');
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    });

    // Handle Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert('Login successful!');
            window.location.href = 'store.html'; // Redirect to store.html
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    });

    // Toggle between forms
    document.querySelectorAll('.toggle-form').forEach(button => {
        button.addEventListener('click', () => {
            document.querySelector('.form-container').classList.toggle('show-signup');
        });
    });
</script>

</body>
</html>
