<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://img.freepik.com/free-photo/3d-illustration-smartphone-with-products-coming-out-screen-online-shopping-e-commerce-concept_58466-14529.jpg?semt=ais_hybrid') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: rgba(52, 58, 64, 0.9); /* Semi-transparent background */
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: rgba(73, 80, 87, 0.9); /* Semi-transparent background */
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 1.1em;
            transition: color 0.3s ease-in-out;
        }

        nav a:hover {
            color: #ffc107;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .address-form h3 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
            color: #495057;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, select {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 5px;
            width: 100%;
        }

        button {
            padding: 12px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"] {
            background-color: #28a745;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        button[type="button"] {
            background-color: #007bff;
            color: white;
        }

        button[type="button"]:hover {
            background-color: #0056b3;
        }

        .back-btn {
            background-color: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .back-btn:hover {
            background-color: #5a6268;
        }

        footer {
            background: rgba(52, 58, 64, 0.9); /* Semi-transparent background */
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 15px;
            }

            header h1 {
                font-size: 2em;
            }
        }
    </style>
    <script>
        function getLocation() {
            const locationButton = document.querySelector("#location-btn");
            locationButton.textContent = "Fetching Location...";
            locationButton.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById("user-address").value =
                            `Lat: ${position.coords.latitude}, Long: ${position.coords.longitude}`;
                        locationButton.textContent = "Use Current Location";
                        locationButton.disabled = false;
                    },
                    (error) => {
                        alert("Unable to fetch location. Please try again.");
                        locationButton.textContent = "Use Current Location";
                        locationButton.disabled = false;
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
                locationButton.textContent = "Use Current Location";
                locationButton.disabled = false;
            }
        }

        function handleSubmit(event) {
            event.preventDefault();

            const fullName = document.getElementById("full-name").value;
            const address = document.getElementById("user-address").value;
            const city = document.getElementById("city").value;
            const state = document.getElementById("state").value;
            const zipcode = document.getElementById("zipcode").value;
            const country = document.getElementById("country").value;

            // Simulate saving the address
            alert(`Thank you, ${fullName}! Your address has been saved.`);
            window.location.href = "payment.html"; // Redirect to payment page
        }
    </script>
</head>
<body>
    <header>
        <h1>Shipping Details</h1>
    </header>

    <nav>
        <a href="store.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="store.html#contact">Contact</a>
    </nav>

    <div class="container address-form">
        <h3>Enter Your Shipping Details</h3>
        <form onsubmit="handleSubmit(event)">
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name" placeholder="John Doe" required>

            <label for="user-address">Street Address:</label>
            <input type="text" id="user-address" name="user-address" placeholder="123 Main St" required>

            <label for="apartment">Apartment, suite, etc. (optional):</label>
            <input type="text" id="apartment" name="apartment" placeholder="Apt 4B">

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="New York" required>

            <label for="state">State/Province:</label>
            <input type="text" id="state" name="state" placeholder="NY" required>

            <label for="zipcode">Zip Code:</label>
            <input type="text" id="zipcode" name="zipcode" placeholder="10001" required>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Select Country</option>
                <option value="India">India</option>
                <option value="USA">United States</option>
                <option value="Canada">Canada</option>
                <option value="UK">United Kingdom</option>
                <option value="Australia">Australia</option>
                <option value="Other">Other</option>
            </select>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" placeholder="(123) 456-7890" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>

            <button type="submit">Submit</button>
            <button type="button" id="location-btn" onclick="getLocation()">Use Current Location</button>
            <button type="button" class="back-btn" onclick="window.location.href='cart.html'">Back to Cart</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Online Shopping. All rights reserved.</p>
    </footer>
</body>
</html>
