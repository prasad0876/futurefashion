<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Invoice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }
        .invoice-container {
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
        }
        .invoice-header h2 {
            color: #232f3e;
        }
        .table thead {
            background-color: #232f3e;
            color: white;
        }
        .total-section {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-print, .btn-track, .btn-letter, .btn-back {
            background-color: #232f3e;
            color: white;
            border-radius: 5px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            margin: 5px;
        }
        .btn-print:hover, .btn-track:hover {
            background-color: #ff9900;
        }
        /* Thank You Message Styling */
        .thank-you-message {
            font-size: 20px;
            font-weight: bold;
            color: #232f3e;
            opacity: 0;
            margin-top: 20px;
            animation: fadeIn 2s forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="invoice-header">
            <h2><i class="bi bi-receipt"></i> Order Invoice</h2>
        </div>

        <div class="invoice-details">
            <p><strong>Order Number:</strong> <span id="orderNumber"></span></p>
            <p><strong>Order Date:</strong> <span id="orderDate"></span></p>
            <p><strong>Payment Method:</strong> <span id="paymentMethod"></span></p>
            <hr>
            <h5>Items Purchased:</h5>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Unit Price (₹)</th>
                        <th>Total Price (₹)</th>
                    </tr>
                </thead>
                <tbody id="itemsList"></tbody>
            </table>
            <div class="total-section">
                <p>Total Amount: ₹<span id="orderAmount">0.00</span></p>
            </div>
        </div>

        <div class="invoice-footer">
            <button class="btn-print" onclick="downloadInvoice()"><i class="bi bi-printer"></i> Download Invoice</button>
            <button class="btn-track" onclick="trackOrder()"><i class="bi bi-truck"></i> Track My Order</button>
            <button class="btn-letter" onclick="window.location.href='love letter 2.html'">Thank you Letter</button>
            <button class="btn-back" onclick="window.location.href='store.html'">Go to Store</button>

        </div>
    </div>

    <!-- Thank You Message Outside the Invoice Box -->
    <div class="thank-you-message">
        Thank you for shopping with us! 😊
    </div>

    <script>
        function generateInvoice() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let urlParams = new URLSearchParams(window.location.search);
            let paymentMethod = urlParams.get("method") || "Unknown";
            
            if (cart.length === 0) {
                document.getElementById("orderAmount").textContent = "0.00";
                return;
            }

            let orderNumber = Math.floor(100000 + Math.random() * 900000);
            let orderDate = new Date().toLocaleDateString();
            let totalAmount = 0;

            document.getElementById("orderNumber").textContent = orderNumber;
            document.getElementById("orderDate").textContent = orderDate;
            document.getElementById("paymentMethod").textContent = paymentMethod;

            let itemsList = document.getElementById("itemsList");
            itemsList.innerHTML = "";

            cart.forEach(item => {
                let itemTotal = (parseFloat(item.price) || 0) * (parseInt(item.quantity) || 1);
                totalAmount += itemTotal;

                let row = `<tr>
                                <td>${item.name || "N/A"}</td>
                                <td>${item.quantity || 1}</td>
                                <td>₹${(parseFloat(item.price) || 0).toFixed(2)}</td>
                                <td>₹${itemTotal.toFixed(2)}</td>
                           </tr>`;
                itemsList.innerHTML += row;
            });

            document.getElementById("orderAmount").textContent = totalAmount.toFixed(2);
            localStorage.removeItem("cart");
        }

        function downloadInvoice() {
            window.print();
        }

        function trackOrder() {
            // Redirect to tracker.html when "Track My Order" is clicked
            window.location.href = "tracker.html";
        }

        window.onload = generateInvoice;
    </script>
</body>
</html>
